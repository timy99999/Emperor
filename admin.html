<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — Император</title>
<script src="./api-config.js"></script>
<style>
  :root {
    --blue: #1d3a8f;
    --red: #c8282e;
    --bg: #f3f2f2;
    --surface: #ffffff;
    --divider: #e2e0e0;
    --text: #1a1a1a;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; color: var(--blue); }
  .sub { color: var(--muted); margin: 0 0 28px; }

  #login-screen { max-width: 360px; margin: 80px auto; text-align: center; }
  #login-screen h1 { text-align: center; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; text-align: left; }
  label { font-size: 13px; color: var(--muted); }
  input[type="password"], input[type="text"], textarea {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--divider);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 10px 16px;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: #2a4aa8; }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: #f9e5e4; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--divider); }
  .btn-ghost:hover { background: #ececec; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--red); font-size: 14px; min-height: 20px; }

  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }

  section { margin-bottom: 40px; }
  section h2 { font-size: 20px; margin: 0 0 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .card .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .status {
    font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px;
  }
  .status.pending { background: #fff3cd; color: #8a6400; }
  .status.approved { background: #e1f5e4; color: #1b7a33; }
  .status.rejected { background: #f9e5e4; color: #8f1a1f; }
  .time { color: var(--muted); font-size: 12px; }
  .text { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { font-size: 13px; padding: 7px 12px; }
  .empty { color: var(--muted); padding: 16px 0; }

  .idea-title { width: 100%; font: 600 16px/1.3 inherit; margin-bottom: 8px; }
  .idea-text { width: 100%; min-height: 70px; margin-bottom: 8px; }
  .idea-likes { color: var(--blue); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--divider); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--divider); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .count { font-weight: 600; color: var(--blue); }

  #dashboard { display: none; }
</style>
</head>
<body>

<div id="login-screen" class="wrap">
  <h1>Админка</h1>
  <p class="sub">Сайт «Император»</p>
  <form id="login-form">
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <div class="error" id="login-error"></div>
    <button type="submit" class="btn-primary" style="width:100%;">Войти</button>
  </form>
</div>

<div id="dashboard" class="wrap">
  <header class="bar">
    <div>
      <h1>Админка</h1>
      <p class="sub">Предложения, идеи и лайки</p>
    </div>
    <button class="btn-ghost" id="logout-btn">Выйти</button>
  </header>

  <section>
    <h2>Предложения</h2>
    <div id="suggestions-list"></div>
  </section>

  <section>
    <h2>Идеи</h2>
    <div class="card">
      <div class="field">
        <label for="idea-new-title">Название новой идеи</label>
        <input type="text" id="idea-new-title" placeholder="Например: Киноночь во дворе">
      </div>
      <div class="field">
        <label for="idea-new-text">Описание</label>
        <textarea id="idea-new-text" placeholder="Коротко опишите идею" style="min-height: 90px;"></textarea>
      </div>
      <div class="error" id="idea-add-error"></div>
      <button class="btn-primary" id="idea-add-btn">Добавить идею</button>
    </div>
    <div id="ideas-list"></div>
  </section>
</div>

<script src="admin.js"></script>
</body>
</html>
